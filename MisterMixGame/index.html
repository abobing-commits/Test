<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>Перематери Илюшку!</title>
  <style>
    :root {
      --normal-image: url("https://i.imgur.com/gyjiB1r.jpeg");
      --laugh-image: url("https://i.imgur.com/DMU0B3f.jpeg");
      --fake-image: url("https://i.imgur.com/kmZlE0q.jpeg");
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #080808;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body { color: #fff; }

    /* Полноэкранные слои: обычный, смех при потере жизни и отдельный фон подмены. */
    .background {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
      will-change: opacity, filter;
    }

    #normal-background {
      z-index: 0;
      background-image: var(--normal-image);
      opacity: 1;
      transition: opacity 80ms linear;
    }

    #laugh-background {
      z-index: 1;
      background-image: var(--laugh-image);
      opacity: 0;
      transition: opacity 50ms linear;
    }

    #fake-background {
      z-index: 2;
      background-image: var(--fake-image);
      opacity: 0;
      transition: opacity 0ms linear;
    }

    body.laughing #normal-background,
    body.faking #normal-background { opacity: 0; }
    body.laughing #laugh-background { opacity: 1; }
    body.faking #fake-background { opacity: 1; }

    /* Лёгкое затемнение помогает читать текст, не создавая отдельной панели. */
    #vignette {
      position: fixed;
      z-index: 3;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(0,0,0,.35), transparent 24%, transparent 66%, rgba(0,0,0,.34));
    }

    #game {
      position: relative;
      z-index: 4;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      isolation: isolate;
    }

    /* Тонкий таймер на самом верхнем краю экрана. */
    #timer-track {
      position: absolute;
      z-index: 10;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,.25);
      overflow: hidden;
    }

    #timer-progress {
      width: 100%;
      height: 100%;
      background: #fff;
      transform-origin: left center;
      transform: scaleX(1);
      will-change: transform;
      box-shadow: 0 0 9px rgba(255,255,255,.65);
    }

    .hud {
      position: absolute;
      top: calc(17px + var(--safe-top));
      z-index: 5;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 8px rgba(0,0,0,.9), 0 1px 2px #000;
      user-select: none;
    }

    #score {
      left: max(18px, env(safe-area-inset-left, 0px));
      font-size: 14px;
      font-weight: 650;
      letter-spacing: .03em;
      opacity: .96;
    }

    #lives {
      right: max(18px, env(safe-area-inset-right, 0px));
      font-size: clamp(17px, 4.6vw, 23px);
      letter-spacing: 2px;
      white-space: nowrap;
    }

    #word-area {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 70px 18px 115px;
      pointer-events: none;
    }

    #word {
      max-width: 100%;
      margin: 0;
      color: #fff;
      font-size: clamp(42px, 11vw, 100px);
      line-height: 1.04;
      font-weight: 900;
      letter-spacing: .035em;
      text-align: center;
      overflow-wrap: anywhere;
      -webkit-text-stroke: 1.5px rgba(0,0,0,.85);
      paint-order: stroke fill;
      text-shadow: 0 3px 0 #000, 0 5px 18px rgba(0,0,0,.95), 0 0 35px rgba(0,0,0,.55);
      text-transform: uppercase;
    }

    #answer-form {
      position: absolute;
      z-index: 6;
      left: 50%;
      bottom: calc(22px + var(--safe-bottom));
      transform: translateX(-50%);
      width: min(560px, calc(100% - 30px));
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    #answer-input {
      display: block;
      flex: 1 1 auto;
      width: 0;
      min-width: 0;
      height: 54px;
      padding: 0 17px;
      border: 1px solid rgba(255,255,255,.43);
      border-radius: 14px;
      outline: none;
      background: rgba(0,0,0,.58);
      color: #fff;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 5px 22px rgba(0,0,0,.22);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }

    #answer-input::placeholder { color: rgba(255,255,255,.76); }
    #answer-input:focus { border-color: rgba(255,255,255,.92); background: rgba(0,0,0,.72); }

    #answer-button {
      flex: 0 0 auto;
      min-width: 104px;
      height: 54px;
      padding: 0 17px;
      border: 1px solid rgba(255,255,255,.42);
      border-radius: 14px;
      background: rgba(255,255,255,.92);
      color: #111;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 22px rgba(0,0,0,.22);
      transition: transform 100ms ease, background 100ms ease;
    }

    #answer-button:active { transform: scale(.96); background: #fff; }
    #answer-input:disabled, #answer-button:disabled { opacity: .55; }

    /* Стартовый экран: заголовок сверху, запуск снизу, без центральной панели. */
    body:not(.started) #game { visibility: hidden; }

    #start-screen {
      position: fixed;
      z-index: 25;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(8vh + var(--safe-top)) 20px calc(30px + var(--safe-bottom));
      text-align: center;
      pointer-events: auto;
    }

    body.started #start-screen { display: none; }

    #start-title {
      max-width: 100%;
      margin: 0;
      color: #fff;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-size: clamp(42px, 10vw, 88px);
      line-height: .98;
      font-weight: 900;
      letter-spacing: .015em;
      text-wrap: balance;
      -webkit-text-stroke: 1px rgba(0,0,0,.8);
      text-shadow: 0 4px 0 #000, 0 7px 24px rgba(0,0,0,.95);
    }

    #start-button {
      min-width: min(260px, 78vw);
      min-height: 60px;
      padding: 15px 34px;
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 16px;
      background: rgba(255,255,255,.93);
      color: #111;
      font: inherit;
      font-size: 23px;
      font-weight: 900;
      letter-spacing: .02em;
      cursor: pointer;
      box-shadow: 0 6px 26px rgba(0,0,0,.35);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      transition: transform 100ms ease, background 100ms ease;
    }

    #start-button:active {
      transform: scale(.96);
      background: #fff;
    }

    /* Красная вспышка и тряска включаются при потере жизни. */
    #red-flash {
      position: fixed;
      z-index: 20;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background: rgba(255, 0, 20, .48);
    }

    body.glitch #red-flash { animation: red-flash 360ms steps(2, end) both; }
    body.glitch #game { animation: screen-shake 420ms cubic-bezier(.36,.07,.19,.97) both; }
    body.glitch #laugh-background { filter: saturate(1.3) contrast(1.12); }

    @keyframes red-flash {
      0% { opacity: 0; }
      18% { opacity: .9; }
      34% { opacity: .15; }
      52% { opacity: .65; }
      100% { opacity: 0; }
    }

    @keyframes screen-shake {
      0%, 100% { transform: translate3d(0,0,0); }
      15% { transform: translate3d(-7px,2px,0) skewX(-.5deg); }
      30% { transform: translate3d(6px,-2px,0); }
      45% { transform: translate3d(-4px,1px,0) skewX(.4deg); }
      60% { transform: translate3d(4px,0,0); }
      75% { transform: translate3d(-2px,-1px,0); }
    }

    /* Короткая тряска только самого слова при фейковой подмене. */
    #word.word-glitch {
      animation: fake-word-glitch 280ms steps(2, end) both;
    }

    @keyframes fake-word-glitch {
      0% { transform: translateX(0) skewX(0); filter: none; }
      18% { transform: translateX(-7px) skewX(-2deg); filter: hue-rotate(35deg); }
      36% { transform: translateX(6px) skewX(2deg); }
      54% { transform: translateX(-4px) skewX(-1deg); filter: blur(.6px); }
      72% { transform: translateX(3px); }
      100% { transform: translateX(0) skewX(0); filter: none; }
    }

    #game-over {
      position: fixed;
      z-index: 30;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      padding: 24px;
      text-align: center;
      background: rgba(0,0,0,.48);
      text-shadow: 0 2px 14px #000;
    }

    #game-over.visible { display: flex; }
    #game-over h2 { margin: 0; font-size: clamp(34px, 8vw, 58px); font-weight: 900; }
    #final-score { margin: 0; font-size: 18px; font-weight: 650; }

    #restart-button {
      margin-top: 12px;
      border: 1px solid rgba(255,255,255,.75);
      border-radius: 14px;
      padding: 13px 22px;
      background: rgba(255,255,255,.92);
      color: #111;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    @media (max-width: 380px) {
      #answer-form { gap: 6px; width: calc(100% - 22px); }
      #answer-button { min-width: 88px; padding: 0 11px; }
      #answer-input { padding: 0 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
      body.glitch #game { animation-duration: 1ms; }
      body.glitch #red-flash { animation-duration: 1ms; }
    }
  </style>
</head>
<body>
  <div id="normal-background" class="background" aria-hidden="true"></div>
  <div id="laugh-background" class="background" aria-hidden="true"></div>
  <div id="fake-background" class="background" aria-hidden="true"></div>
  <div id="vignette" aria-hidden="true"></div>
  <div id="red-flash" aria-hidden="true"></div>

  <section id="start-screen" aria-labelledby="start-title">
    <h1 id="start-title">Перематери Илюшку!</h1>
    <button id="start-button" type="button">Погнали!</button>
  </section>

  <main id="game" aria-label="Словесная игра">
    <div id="timer-track" role="progressbar" aria-label="Оставшееся время" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
      <div id="timer-progress"></div>
    </div>

    <div id="score" class="hud">ОЧКИ: <span id="score-value">0</span></div>
    <div id="lives" class="hud" aria-label="Жизни">❤️❤️❤️❤️❤️</div>

    <section id="word-area" aria-live="polite">
      <h1 id="word">ГОТОВ?</h1>
    </section>

    <form id="answer-form" autocomplete="off">
      <input
        id="answer-input"
        type="text"
        placeholder="Введи слово…"
        aria-label="Твой ответ"
        autocapitalize="off"
        spellcheck="false"
        enterkeyhint="send"
        required
      >
      <button id="answer-button" type="submit">Ответить</button>
    </form>
  </main>

  <section id="game-over" role="dialog" aria-modal="true" aria-labelledby="game-over-title">
    <h2 id="game-over-title">Отпетушили тя!</h2>
    <p id="final-score">Твой счёт: 0</p>
    <button id="restart-button" type="button">Играть снова</button>
  </section>

  <script>
    (() => {
      'use strict';

      // Фоновая музыка загружается по прямой ссылке на MP3.
      // Воспроизведение запускается только после нажатия «Погнали!».
      const bgMusic = new Audio('https://cdn.dbimg.app/SuTj8Nf1.mp3');
      bgMusic.loop = true;
      bgMusic.preload = 'auto';

      const DEFAULT_TIME_LIMIT_SECONDS = 4;
      const SHORT_WORD_TIME_LIMIT_SECONDS = 3;
      const SCORE_10_TIME_LIMIT_SECONDS = 3;
      const SCORE_10_SHORT_WORD_TIME_LIMIT_SECONDS = 2.6;
      const HIDDEN_LETTER_CHANCE = 0.30; // 30% для каждого нового целевого слова.
      const MAX_LIVES = 3;
      const BONUS_STREAK = 5;
      const LAUGH_DURATION_MS = 1000;
      const FAKE_SWAP_CHANCE = 0.40; // 40% на одно слово после начала ввода.
      const FAKE_LAUGH_DURATION_MS = 500;
      const FAKE_WORD_GLITCH_DURATION_MS = 320;
      const WORDS = [
        'чёрт',
        'буллинг',
        'водка',
        'ребёнок',
        'Владик',
        'блять',
        'сука',
        'мразь',
        'кража',
        'статья',
        'срок',
        'ходка',
        'воровство',
        'вор',
        'Влад',
        'бля',
        'блядь',
        'пизда',
        'хуй',
        'хйу',
        'сигарета',
        'сижки',
        'сижка',
        'пьяница',
        'похмелье',
        'опохмел',
        'мелочь',
        'шелупонь',
        'феня',
        'козёл',
        'петух',
        'попуск',
        'параша',
        'зона',
        'зэк',
        'мусора',
        'шухер',
        'менты',
        'атас',
        'жопа',
        'ёпта'
      ];

      const $ = (id) => document.getElementById(id);
      const wordElement = $('word');
      const scoreElement = $('score-value');
      const livesElement = $('lives');
      const timerProgress = $('timer-progress');
      const timerTrack = $('timer-track');
      const form = $('answer-form');
      const input = $('answer-input');
      const answerButton = $('answer-button');
      const gameOverScreen = $('game-over');
      const finalScore = $('final-score');
      const restartButton = $('restart-button');
      const startButton = $('start-button');

      let score = 0;
      let lives = MAX_LIVES;
      let streak = 0;
      let currentWord = ''; // Всегда хранит полное исходное слово для проверки.
      let hiddenLetterIndex = -1;
      let currentRoundTimeLimitMs = DEFAULT_TIME_LIMIT_SECONDS * 1000;
      let deadline = 0;
      let gameOver = false;
      let gameStarted = false;
      let transitioning = false;
      let previousWord = '';
      let wordDeck = [];
      let deckStage = '';
      let fakeSwapCheckedForCurrentWord = false;
      let reactionTimeout = null;
      let laughBackgroundTimeout = null;
      let fakeBackgroundTimeout = null;
      let wordGlitchTimeout = null;
      let timerFrame = null;

      // Нормализация регистра, пробелов и «ё/е».
      function normalizeWord(value) {
        return value.trim().toLocaleLowerCase('ru-RU').replace(/ё/g, 'е').replace(/\s+/g, ' ');
      }

      // Выбираем длительность по длине слова и текущему счёту.
      // До 10 очков: короткие — 3 с, остальные — 4 с.
      // Начиная с 10 очков: короткие — 2,6 с, остальные — 3 с.
      function getTimeLimitForWord(word) {
        const isShortWord = Array.from(word).length <= 5;

        if (score >= 10) {
          return isShortWord
            ? SCORE_10_SHORT_WORD_TIME_LIMIT_SECONDS
            : SCORE_10_TIME_LIMIT_SECONDS;
        }

        return isShortWord
          ? SHORT_WORD_TIME_LIMIT_SECONDS
          : DEFAULT_TIME_LIMIT_SECONDS;
      }

      // Сохраняем оригинал в currentWord, а на экране иногда прячем
      // одну случайную букву. Проверка ответа всегда идёт по оригиналу.
      function setTargetWord(word) {
        currentWord = word;
        const visibleCharacters = Array.from(word);
        hiddenLetterIndex = -1;

        if (
          visibleCharacters.length >= 3 &&
          Math.random() < HIDDEN_LETTER_CHANCE
        ) {
          hiddenLetterIndex = Math.floor(Math.random() * visibleCharacters.length);
          visibleCharacters[hiddenLetterIndex] = '_';
        }

        wordElement.textContent = visibleCharacters.join('');
      }

      // ==============================
      // ДИНАМИЧЕСКАЯ СЛОЖНОСТЬ И КОЛОДА
      // ==============================

      function getDifficultyStage() {
        if (score < 10) return 'short';
        if (score <= 20) return 'medium';
        return 'long';
      }

      // Фильтруем исходный список по текущему счёту.
      // Если слов нужной длины нет, используем общий массив.
      function getWordsForCurrentStage() {
        const stage = getDifficultyStage();
        const filteredWords = WORDS.filter((word) => {
          const length = word.length;
          if (stage === 'short') return length >= 3 && length <= 5;
          if (stage === 'medium') return length >= 6 && length <= 8;
          return length >= 9;
        });

        if (filteredWords.length === 0) {
          return [...WORDS];
        }

        // Если в уровне сложности осталось только то же самое слово,
        // которое выпало предыдущим, берём одно случайное слово из общего
        // списка. Это сохраняет правило «не повторять подряд» даже в фазе
        // 9+, где в исходном списке сейчас только одно подходящее слово.
        const alternatives = filteredWords.filter(
          (word) => normalizeWord(word) !== normalizeWord(previousWord)
        );
        if (alternatives.length === 0 && previousWord) {
          const fallbackWords = WORDS.filter(
            (word) => normalizeWord(word) !== normalizeWord(previousWord)
          );
          if (fallbackWords.length > 0) {
            return [fallbackWords[Math.floor(Math.random() * fallbackWords.length)]];
          }
        }

        return filteredWords;
      }

      function shuffleWords(words) {
        const shuffled = [...words];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
      }

      // Колода содержит только слова текущей сложности. Каждое слово
      // выпадает один раз за колоду, затем список перемешивается заново.
      function refillWordDeck() {
        wordDeck = shuffleWords(getWordsForCurrentStage());
        deckStage = getDifficultyStage();

        // Извлекаем слова с конца. Избегаем совпадения на границе колод,
        // когда в текущей выборке есть хотя бы одна альтернатива.
        const lastIndex = wordDeck.length - 1;
        if (
          wordDeck.length > 1 &&
          normalizeWord(wordDeck[lastIndex]) === normalizeWord(previousWord)
        ) {
          const replacementIndex = wordDeck.findIndex(
            (word, index) =>
              index !== lastIndex &&
              normalizeWord(word) !== normalizeWord(previousWord)
          );
          if (replacementIndex !== -1) {
            [wordDeck[lastIndex], wordDeck[replacementIndex]] =
              [wordDeck[replacementIndex], wordDeck[lastIndex]];
          }
        }
      }

      function chooseWord() {
        if (WORDS.length === 0) return 'СЛОВО';

        const currentStage = getDifficultyStage();
        if (wordDeck.length === 0 || deckStage !== currentStage) {
          refillWordDeck();
        }

        const next = wordDeck.pop();
        previousWord = next;
        return next;
      }

      // Для фейковой подмены берём другое слово из оставшейся колоды.
      // Если в текущей категории нет альтернативы (например, на высокой
      // сложности остался единственный длинный вариант), используем любое
      // другое слово из общего списка, чтобы подмена действительно отличалась.
      function chooseFakeReplacement() {
        const currentStage = getDifficultyStage();
        if (wordDeck.length === 0 || deckStage !== currentStage) {
          refillWordDeck();
        }

        let alternatives = wordDeck.filter(
          (word) => normalizeWord(word) !== normalizeWord(currentWord)
        );

        if (alternatives.length > 0) {
          const replacement = alternatives[Math.floor(Math.random() * alternatives.length)];
          const deckIndex = wordDeck.indexOf(replacement);
          if (deckIndex !== -1) wordDeck.splice(deckIndex, 1);
          previousWord = replacement;
          return replacement;
        }

        const fallbackWords = WORDS.filter(
          (word) => normalizeWord(word) !== normalizeWord(currentWord)
        );
        if (fallbackWords.length === 0) return currentWord;

        const replacement = fallbackWords[Math.floor(Math.random() * fallbackWords.length)];
        // После вне-категорийной подмены соберём чистую колоду уровня
        // заново при следующем обычном выборе слова.
        wordDeck = [];
        deckStage = '';
        previousWord = replacement;
        return replacement;
      }

      function renderLives() {
        // Сердечки — единственный индикатор жизней.
        livesElement.textContent = '❤️'.repeat(lives) + '🖤'.repeat(MAX_LIVES - lives);
        livesElement.setAttribute('aria-label', `Жизни: ${lives} из ${MAX_LIVES}`);
      }

      function renderScore() {
        scoreElement.textContent = String(score);
      }

      function setProgress(fraction) {
        const safeFraction = Math.max(0, Math.min(1, fraction));
        timerProgress.style.transform = `scaleX(${safeFraction})`;
        timerTrack.setAttribute('aria-valuenow', String(Math.round(safeFraction * 100)));
      }

      function focusInput() {
        if (!gameOver && !transitioning) {
          try { input.focus({ preventScroll: true }); }
          catch (_) { input.focus(); }
        }
      }

      function startNewWord() {
        if (gameOver) return;
        transitioning = false;
        setTargetWord(chooseWord());
        fakeSwapCheckedForCurrentWord = false;
        wordElement.classList.remove('word-glitch');
        input.value = '';
        input.disabled = false;
        answerButton.disabled = false;
        currentRoundTimeLimitMs = getTimeLimitForWord(currentWord) * 1000;
        deadline = Date.now() + currentRoundTimeLimitMs;
        setProgress(1);
        focusInput();
      }

      function updateTimer() {
        if (!gameStarted || gameOver || transitioning || deadline === 0) return;
        const remaining = deadline - Date.now();
        const fraction = remaining / currentRoundTimeLimitMs;
        setProgress(fraction);
        if (remaining <= 0) loseLife('timeout');
      }

      function tick() {
        updateTimer();
        timerFrame = window.requestAnimationFrame(tick);
      }

      // ==============================
      // ФЕЙКОВАЯ ПОДМЕНА ВО ВРЕМЯ ВВОДА
      // ==============================

      // Смеющаяся картинка используется только при потере жизни.
      function showLaughingBackground(durationMs) {
        window.clearTimeout(laughBackgroundTimeout);
        window.clearTimeout(fakeBackgroundTimeout);
        fakeBackgroundTimeout = null;
        document.body.classList.remove('faking');
        document.body.classList.add('laughing');
        laughBackgroundTimeout = window.setTimeout(() => {
          document.body.classList.remove('laughing');
          laughBackgroundTimeout = null;
        }, durationMs);
      }

      // Третья картинка показывается только при фейковой подмене.
      function showFakeBackground(durationMs) {
        window.clearTimeout(fakeBackgroundTimeout);
        document.body.classList.remove('laughing');
        document.body.classList.add('faking');
        fakeBackgroundTimeout = window.setTimeout(() => {
          document.body.classList.remove('faking');
          fakeBackgroundTimeout = null;
        }, durationMs);
      }

      function triggerFakeWordSwap() {
        const replacement = chooseFakeReplacement();
        if (!replacement || normalizeWord(replacement) === normalizeWord(currentWord)) {
          return;
        }

        // Подмена полностью очищает поле ввода. Новое целевое слово
        // получает собственный независимый шанс 30% на скрытую букву.
        setTargetWord(replacement);
        input.value = '';

        // Таймер при подмене не перезапускается: сохраняем остаток времени,
        // но ограничиваем его длительностью, положенной новому слову.
        const remainingTimeMs = Math.max(0, deadline - Date.now());
        currentRoundTimeLimitMs = getTimeLimitForWord(currentWord) * 1000;
        deadline = Date.now() + Math.min(remainingTimeMs, currentRoundTimeLimitMs);

        showFakeBackground(FAKE_LAUGH_DURATION_MS);

        window.clearTimeout(wordGlitchTimeout);
        wordElement.classList.remove('word-glitch');
        void wordElement.offsetWidth; // Перезапуск CSS-анимации.
        wordElement.classList.add('word-glitch');
        wordGlitchTimeout = window.setTimeout(() => {
          wordElement.classList.remove('word-glitch');
          wordGlitchTimeout = null;
        }, FAKE_WORD_GLITCH_DURATION_MS);
      }

      function handleAnswerInput() {
        if (!gameStarted || gameOver || transitioning || !currentWord) return;

        const typed = normalizeWord(input.value);
        if (!typed || typed === normalizeWord(currentWord)) return;
        if (fakeSwapCheckedForCurrentWord) return;

        // 15% проверяются один раз на слово, после первого непустого
        // неполного ввода, а не на каждую букву.
        fakeSwapCheckedForCurrentWord = true;
        if (Math.random() < FAKE_SWAP_CHANCE) {
          triggerFakeWordSwap();
        }
      }

      function submitAnswer() {
        if (gameOver || transitioning || !currentWord) return;
        const answer = normalizeWord(input.value);
        if (!answer) {
          input.focus();
          return;
        }

        // Enter и кнопка формы используют один и тот же обработчик submit.
        if (answer === normalizeWord(currentWord)) {
          score += 1;
          streak += 1;
          renderScore();

          if (streak > 0 && streak % BONUS_STREAK === 0) {
            if (lives < MAX_LIVES) {
              lives += 1;
              renderLives();
            }
          }

          startNewWord();
        } else {
          loseLife('wrong');
        }
      }

      function loseLife(reason) {
        // За одно слово учитывается только одно событие потери жизни.
        if (gameOver || transitioning) return;
        transitioning = true;
        deadline = 0;
        lives = Math.max(0, lives - 1);
        streak = 0;
        renderLives();
        setProgress(0);
        input.disabled = true;
        answerButton.disabled = true;

        // Показать смеющуюся картинку на 1 секунду и запустить глитч.
        showLaughingBackground(LAUGH_DURATION_MS);
        document.body.classList.add('glitch');
        window.clearTimeout(reactionTimeout);
        reactionTimeout = window.setTimeout(() => {
          document.body.classList.remove('laughing', 'glitch');
          window.clearTimeout(laughBackgroundTimeout);
          laughBackgroundTimeout = null;
          if (lives <= 0) {
            finishGame();
          } else {
            startNewWord();
          }
        }, LAUGH_DURATION_MS);
      }

      function finishGame() {
        gameOver = true;
        transitioning = false;
        deadline = 0;
        input.disabled = true;
        answerButton.disabled = true;
        setProgress(0);
        finalScore.textContent = `Твой счёт: ${score}`;
        gameOverScreen.classList.add('visible');

        // Отправляем итоговый счёт, если игра запущена в среде Telegram Games.
        try {
          if (window.TelegramGameProxy && typeof window.TelegramGameProxy.sendScore === 'function') {
            window.TelegramGameProxy.sendScore(score);
          } else {
            console.info('TelegramGameProxy.sendScore недоступен в этом браузере. Счёт:', score);
          }
        } catch (error) {
          console.warn('Не удалось отправить счёт в Telegram:', error);
        }
      }

      function startGame() {
        if (gameStarted || gameOver) return;
        gameStarted = true;

        // play() вызывается непосредственно по нажатию пользователя,
        // чтобы браузер разрешил запуск звука. Если поток недоступен
        // или воспроизведение запрещено, игра продолжит работать без музыки.
        const musicPromise = bgMusic.play();
        if (musicPromise && typeof musicPromise.catch === 'function') {
          musicPromise.catch((error) => {
            console.warn('Не удалось запустить фоновую музыку:', error);
          });
        }

        document.body.classList.add('started');
        renderScore();
        renderLives();
        startNewWord();
        timerFrame = window.requestAnimationFrame(tick);
      }

      function restartGame() {
        window.clearTimeout(reactionTimeout);
        window.clearTimeout(laughBackgroundTimeout);
        window.clearTimeout(fakeBackgroundTimeout);
        window.clearTimeout(wordGlitchTimeout);
        document.body.classList.remove('laughing', 'faking', 'glitch');
        wordElement.classList.remove('word-glitch');
        score = 0;
        lives = MAX_LIVES;
        streak = 0;
        currentWord = '';
        previousWord = '';
        wordDeck = [];
        deadline = 0;
        gameOver = false;
        gameStarted = true;
        transitioning = false;
        document.body.classList.add('started');
        renderScore();
        renderLives();
        gameOverScreen.classList.remove('visible');
        startNewWord();
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        submitAnswer();
      });

      input.addEventListener('input', handleAnswerInput);

      startButton.addEventListener('click', startGame);
      restartButton.addEventListener('click', restartGame);

      // Предзагрузка всех трёх картинок предотвращает задержку при переключении.
      const preloadImages = [
        'https://i.imgur.com/gyjiB1r.jpeg',
        'https://i.imgur.com/DMU0B3f.jpeg',
        'https://i.imgur.com/kmZlE0q.jpeg'
      ];
      preloadImages.forEach((src) => {
        const image = new Image();
        image.src = src;
      });

      renderScore();
      renderLives();
      setProgress(1);

      window.addEventListener('pagehide', () => {
        if (timerFrame !== null) window.cancelAnimationFrame(timerFrame);
        window.clearTimeout(reactionTimeout);
        window.clearTimeout(laughBackgroundTimeout);
        window.clearTimeout(fakeBackgroundTimeout);
        window.clearTimeout(wordGlitchTimeout);
      });
    })();
  </script>
</body>
</html>
